{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kilele Roasters | Kenyan coffee, roasted in Nairobi{% endblock %}</title>
<meta name="description" content="Single-farm Kenyan coffee, roasted to order in Nairobi and sorted by the altitude it grew at.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/kilele.css' %}">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-md site-nav">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Kilele</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-md-3">
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#coffees">Coffees</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#method">How we roast</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#contact">Order or ask</a></li>
      </ul>
    </div>
  </div>
</nav>
<main id="main">{% block content %}{% endblock %}</main>
<footer class="site-foot">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span>Kilele Roasters, Ngong Road, Nairobi</span>
    <span>Roast days: Tuesday and Friday</span>
  </div>
</footer>
<script src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
